  <!-- Eliminamos los bubbles con corazones y agregamos el script de fuegos artificiales -->
  <script>
    (function() {
        const canvas = document.getElementById('fireworksCanvas');
        if (!canvas) return;
        
        const ctx = canvas.getContext('2d');
        
        let particles = [];
        let rockets = [];
        let width, height;
        
        // Colores vibrantes para los fuegos artificiales
        const colors = [
            '#ff0040', '#ff8000', '#ffff00', '#80ff00', '#00ff80',
            '#00ffff', '#0080ff', '#8000ff', '#ff00ff', '#ff40c0',
            '#ff6600', '#ffcc00', '#ff0066', '#ff3300', '#ff9933',
            '#ff00cc', '#00ffcc', '#ff4444', '#ffaa44', '#ffff44'
        ];
        
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        
        // Clase para las partículas de la explosión
        class Particle {
            constructor(x, y, color, size = 3) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = size;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 5 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.gravity = 0.1;
                this.alpha = 1;
                this.decay = 0.015 + Math.random() * 0.01;
                this.friction = 0.98;
            }
            
            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                return this.alpha > 0;
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // Añadir brillo
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }
        }
        
        // Clase para el cohete
        class Rocket {
            constructor(x, y, targetY, color) {
                this.x = x;
                this.y = y;
                this.targetY = targetY;
                this.color = color;
                this.speed = 5;
                this.size = 3;
                this.trail = [];
            }
            
            update() {
                this.trail.push({x: this.x, y: this.y});
                if (this.trail.length > 8) this.trail.shift();
                
                this.y -= this.speed;
                return this.y <= this.targetY;
            }
            
            draw() {
                // Dibujar estela
                for (let i = 0; i < this.trail.length; i++) {
                    const t = this.trail[i];
                    const alpha = (i + 1) / this.trail.length * 0.5;
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.globalAlpha = alpha;
                    ctx.arc(t.x, t.y, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.globalAlpha = 1;
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            explode() {
                const particleCount = 70 + Math.floor(Math.random() * 50);
                for (let i = 0; i < particleCount; i++) {
                    particles.push(new Particle(this.x, this.y, this.color, Math.random() * 2.5 + 1.5));
                }
                
                // Partículas secundarias de colores aleatorios
                for (let i = 0; i < particleCount / 2; i++) {
                    const secondaryColor = colors[Math.floor(Math.random() * colors.length)];
                    particles.push(new Particle(this.x, this.y, secondaryColor, Math.random() * 1.5 + 1));
                }
            }
        }
        
        // Crear un nuevo fuego artificial
        function createFirework() {
            const x = Math.random() * width;
            const y = height;
            const targetY = 80 + Math.random() * (height * 0.6);
            const color = colors[Math.floor(Math.random() * colors.length)];
            rockets.push(new Rocket(x, y, targetY, color));
        }
        
        // Crear múltiples fuegos artificiales simultáneos
        function createFireworkBurst() {
            const burstCount = 2 + Math.floor(Math.random() * 4);
            for (let i = 0; i < burstCount; i++) {
                setTimeout(() => createFirework(), i * 100);
            }
        }
        
        // Animación principal
        function animate() {
            if (!ctx) return;
            ctx.clearRect(0, 0, width, height);
            
            // Actualizar y dibujar cohetes
            for (let i = rockets.length - 1; i >= 0; i--) {
                const rocket = rockets[i];
                rocket.draw();
                const exploded = rocket.update();
                if (exploded) {
                    rocket.explode();
                    rockets.splice(i, 1);
                }
            }
            
            // Actualizar y dibujar partículas
            for (let i = particles.length - 1; i >= 0; i--) {
                const particle = particles[i];
                particle.draw();
                const alive = particle.update();
                if (!alive) {
                    particles.splice(i, 1);
                }
            }
            
            requestAnimationFrame(animate);
        }
        
        // Iniciar fuegos artificiales continuos
        let fireworkInterval;
        
        function startFireworks() {
            if (fireworkInterval) clearInterval(fireworkInterval);
            fireworkInterval = setInterval(() => {
                if (rockets.length < 8) {
                    createFireworkBurst();
                }
            }, 800);
        }
        
        // Eventos
        window.addEventListener('resize', () => {
            resizeCanvas();
        });
        
        // Click para más fuegos artificiales
        canvas.addEventListener('click', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            // Crear explosión en el punto clickeado
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particleCount = 50;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color, Math.random() * 3 + 1));
            }
            for (let i = 0; i < particleCount / 2; i++) {
                const secondaryColor = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(x, y, secondaryColor, Math.random() * 2 + 1));
            }
        });
        
        // También al hacer clic en cualquier parte de la página
        document.body.addEventListener('click', (e) => {
            if (e.target === canvas) return;
            const x = e.clientX;
            const y = e.clientY;
            const color = colors[Math.floor(Math.random() * colors.length)];
            const particleCount = 40;
            for (let i = 0; i < particleCount; i++) {
                particles.push(new Particle(x, y, color, Math.random() * 3 + 1));
            }
        });
        
        // Inicializar
        resizeCanvas();
        startFireworks();
        animate();
        
        // También crear algunos fuegos artificiales al inicio
        setTimeout(() => {
            for (let i = 0; i < 5; i++) {
                setTimeout(() => createFireworkBurst(), i * 300);
            }
        }, 500);
        
        // Crear fuegos artificiales periódicamente en posiciones aleatorias
        setInterval(() => {
            if (Math.random() > 0.3) {
                createFireworkBurst();
            }
        }, 2000);
    })();
  </script>
